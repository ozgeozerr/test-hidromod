<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>İletişim - Hidromod</title>
        <link rel="icon" type="image/png" href="/hidromod_logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/styles.css" />
        <style>
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .animate-fade-in-up {
                animation: fadeInUp 0.8s ease-out forwards;
            }

            .map-container {
                position: relative;
                width: 100%;
                height: 400px;
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 10px 40px rgba(0, 161, 224, 0.2);
            }

            .map-container iframe {
                width: 100%;
                height: 100%;
                border: 0;
            }
        </style>
    </head>
    <body style="background-color: #f8f9fa !important">
        <div id="navbar-placeholder"></div>

        <!-- Hero Section -->
        <section class="pt-32 pb-16 px-8">
            <div class="max-w-7xl mx-auto">
                <div class="text-center animate-fade-in-up">
                    <h1
                        class="text-5xl md:text-6xl font-bold text-gray-900 mb-6"
                        data-i18n="contactFormTitle"
                    >
                        Bize <span class="text-[#00a1e0]">Ulaşın</span>
                    </h1>
                    <p
                        class="text-xl text-gray-600 max-w-3xl mx-auto"
                        data-i18n="contactSubtitle"
                    >
                        Hidrometeorolojik tahmin ve analiz çözümlerimiz hakkında
                        detaylı bilgi almak için bizimle iletişime geçin.
                    </p>
                </div>
            </div>
        </section>

        <!-- Contact Content Section -->
        <section class="py-16 px-8">
            <div class="max-w-7xl mx-auto">
                <div class="grid md:grid-cols-2 gap-12">
                    <!-- Contact Information -->
                    <div
                        class="space-y-8 animate-fade-in-up"
                        style="animation-delay: 0.2s"
                    >
                        <!-- Email Card -->
                        <div
                            class="bg-gradient-to-br from-[#1a2847] to-[#141d39] border border-[#00a1e0]/30 rounded-2xl p-8 hover:border-[#00a1e0]/50 transition-all duration-300"
                        >
                            <div class="flex items-start gap-4">
                                <div
                                    class="flex-shrink-0 w-12 h-12 bg-[#00a1e0]/10 rounded-lg flex items-center justify-center"
                                >
                                    <svg
                                        class="w-6 h-6 text-[#00a1e0]"
                                        fill="none"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            stroke-width="2"
                                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                                        ></path>
                                    </svg>
                                </div>
                                <div class="flex-1">
                                    <h3
                                        class="text-white font-semibold text-lg mb-2"
                                        data-i18n="email"
                                    >
                                        E-posta
                                    </h3>
                                    <p class="text-gray-400 text-sm mb-4">
                                        Sorularınız için bize e-posta gönderin
                                    </p>
                                    <a
                                        href="#"
                                        id="email-link"
                                        class="text-[#00a1e0] hover:text-[#4fd1c5] transition-colors duration-200 font-medium"
                                    >
                                        E-posta Gönder
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Address Card -->
                        <div
                            class="bg-gradient-to-br from-[#1a2847] to-[#141d39] border border-[#00a1e0]/30 rounded-2xl p-8 hover:border-[#00a1e0]/50 transition-all duration-300"
                        >
                            <div class="flex items-start gap-4">
                                <div
                                    class="flex-shrink-0 w-12 h-12 bg-[#00a1e0]/10 rounded-lg flex items-center justify-center"
                                >
                                    <svg
                                        class="w-6 h-6 text-[#00a1e0]"
                                        fill="none"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            stroke-width="2"
                                            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
                                        ></path>
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            stroke-width="2"
                                            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
                                        ></path>
                                    </svg>
                                </div>
                                <div class="flex-1">
                                    <h3
                                        class="text-white font-semibold text-lg mb-2"
                                    >
                                        Adres
                                    </h3>
                                    <p class="text-gray-300 leading-relaxed">
                                        ODTÜ Teknokent<br />
                                        Çankaya, Ankara, Türkiye
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Contact Button -->
                        <button
                            id="contact-btn"
                            class="w-full bg-gradient-to-r from-[#00a1e0] to-[#0088c7] text-white px-8 py-4 rounded-xl font-semibold text-lg hover:shadow-lg hover:shadow-[#00a1e0]/30 transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-3"
                        >
                            <svg
                                class="w-6 h-6"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                                ></path>
                            </svg>
                            Bize Ulaşın
                        </button>
                    </div>

                    <!-- Google Maps -->
                    <div
                        class="animate-fade-in-up"
                        style="animation-delay: 0.4s"
                    >
                        <div class="map-container">
                            <iframe
                                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3061.9384668865394!2d32.778688876295376!3d39.89095019428944!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14d34f25e8f83977%3A0x4c8fbd421d9cb111!2zT0RUw5wgVGVrbm9rZW50!5e0!3m2!1sen!2str!4v1707573700000!5m2!1sen!2str"
                                loading="lazy"
                                referrerpolicy="no-referrer-when-downgrade"
                            ></iframe>
                        </div>
                        <p class="text-gray-400 text-sm mt-4 text-center">
                            Haritada konumumuzu görüntüleyebilirsiniz
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <div id="footer-placeholder"></div>

        <script>
            // Email obfuscation to prevent spam
            function getEmail() {
                const user = "info";
                const domain = "hidromod";
                const tld = "com.tr";
                return user + "@" + domain + "." + tld;
            }

            // Set up email links on page load
            document.addEventListener("DOMContentLoaded", function () {
                const emailLink = document.getElementById("email-link");
                const footerEmailLink =
                    document.getElementById("footer-email-link");
                const contactBtn = document.getElementById("contact-btn");

                const email = getEmail();
                const mailtoLink = "mailto:" + email;

                if (emailLink) {
                    emailLink.href = mailtoLink;
                }
                if (footerEmailLink) {
                    footerEmailLink.href = mailtoLink;
                }
                if (contactBtn) {
                    contactBtn.addEventListener("click", function () {
                        window.location.href = mailtoLink;
                    });
                }
            });

        </script>
        <script type="module" src="/main.js"></script>
    </body>
</html>
